name: Sync video phrases
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/sync_phrases.py
      - .github/workflows/sync-phrases.yml
permissions:
  contents: read
concurrency:
  group: video-phrases
  cancel-in-progress: false
jobs:
  subtitles:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install 'youtube-transcript-api==1.2.4' 'yt-dlp>=2026.9,<2026.11'
      - name: Extract publicly available Polish captions
        run: python scripts/sync_phrases.py
      - name: Save extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phrases.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update available caption phrases"
            git push
          fi
