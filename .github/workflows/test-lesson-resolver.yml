name: Validate lesson presentation matching
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'lesson-resolver.js'
      - 'presentation-import.js'
      - 'learn.js'
      - 'learn.html'
      - 'data/videos.json'
      - 'tests/lesson-resolver.test.cjs'
      - '.github/workflows/test-lesson-resolver.yml'
  push:
    branches: [master]
    paths:
      - 'lesson-resolver.js'
      - 'presentation-import.js'
      - 'learn.js'
      - 'data/videos.json'
      - 'tests/lesson-resolver.test.cjs'
      - '.github/workflows/test-lesson-resolver.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check lesson-resolver.js && node --check presentation-import.js && node --check learn.js
      - run: node --test tests/lesson-resolver.test.cjs
