name: Validate shared site navigation
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'academy.html'
      - 'academy.js'
      - 'learn.html'
      - 'index.html'
      - 'audio.html'
      - 'leaderboard.html'
      - 'global-ui.js'
      - 'shared-nav.js'
      - 'mobile-nav.js'
      - 'site-nav-consistency.css'
      - 'tests/site-navigation.e2e.cjs'
      - '.github/workflows/test-site-navigation.yml'
  workflow_dispatch:
jobs:
  browser-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check academy.js && node --check shared-nav.js && node --check global-ui.js
      - run: node tests/site-navigation.e2e.cjs
