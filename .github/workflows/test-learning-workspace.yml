name: Learning workspace browser checks
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'learn.html'
      - 'learn.js'
      - 'reader.js'
      - 'presentation-import.js'
      - 'presentation-phrases.js'
      - 'tests/presentation-phrases.test.cjs'
      - 'learning-workspace.js'
      - 'learning-workspace.css'
      - 'presentation-import.css'
      - 'site-chrome-v74.js'
      - 'site-chrome-v74.css'
      - 'cabinet-favorites.js'
      - 'header-brand.js'
      - 'shared-nav.js'
      - 'learning-router.js'
      - 'tests/learning-workspace.e2e.cjs'
      - '.github/workflows/test-learning-workspace.yml'
  workflow_dispatch:
jobs:
  chrome-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check learning-workspace.js && node --check presentation-import.js && node --check learn.js && node --check reader.js
      - run: node --check presentation-phrases.js && node --test tests/presentation-phrases.test.cjs
      - run: node tests/learning-workspace.e2e.cjs
