name: Static security regression checks
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'presentation-import.js'
      - 'audio-youtube-catalog.js'
      - 'academy.js'
      - 'onas-easter-egg.js'
      - 'mobile-nav.js'
      - 'onas-isolated.html'
      - 'site.js'
      - 'cabinet-favorites.js'
      - 'vendor/**'
      - 'scripts/audit-legacy-pages.cjs'
      - 'ONAS/**'
      - 'new *.html'
      - 'tests/security-runtime.e2e.cjs'
      - '*.html'
      - 'tests/security-audit.test.cjs'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [master]
    paths:
      - 'presentation-import.js'
      - 'audio-youtube-catalog.js'
      - '*.html'
      - 'tests/security-audit.test.cjs'
      - '.github/workflows/security-audit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check presentation-import.js && node --check audio-youtube-catalog.js
      - run: node --test tests/security-audit.test.cjs
      - run: node scripts/audit-legacy-pages.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/security-runtime.e2e.cjs
