name: Sync video phrases
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/sync_phrases.py
      - .github/workflows/sync-phrases.yml
permissions:
  contents: read
concurrency:
  group: video-phrases
  cancel-in-progress: false
jobs:
  subtitles:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install 'youtube-transcript-api==1.2.4' 'yt-dlp>=2026.9,<2026.11'
      - name: Extract publicly available Polish captions
        run: python scripts/sync_phrases.py
      - name: Save extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phrases.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update available caption phrases"
            git push
          fi
