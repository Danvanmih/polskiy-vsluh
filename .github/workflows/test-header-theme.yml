name: Verify header and theme UI
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'index.html'
      - 'academy.html'
      - 'academy.js'
      - 'learn.html'
      - 'audio.html'
      - 'header-brand.js'
      - 'palette-brand-unified.css'
      - 'tests/theme-header.e2e.cjs'
      - '.github/workflows/test-header-theme.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check academy.js && node --check header-brand.js
      - run: node tests/theme-header.e2e.cjs
